name: Build and release Zeus

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS arm64 app
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(jq -r '.version' mygo.json)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "::error::Tag version $tag_version does not match mygo.json version $app_version"
            exit 1
          fi

      - name: Build app and disk image
        run: go tool mygo build -platform darwin/arm64

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Zeus-macos-arm64
          path: build/darwin-arm64/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: Zeus-macos-arm64
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/*.dmg --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
